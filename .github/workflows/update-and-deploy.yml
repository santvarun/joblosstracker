name: Update layoffs data

# The self-updating engine. On a weekly schedule (and on demand) this fetches
# fresh layoff news, extracts structured records, and commits the updated
# dataset to docs/data/layoffs.json.
#
# Publishing is handled by GitHub Pages "Deploy from a branch" (main /docs):
# every commit to docs/ is auto-published by Pages — no deploy job, no
# github-pages environment, nothing to gate.
#
# NOTE: GitHub only runs scheduled workflows on the repository's DEFAULT branch.

on:
  schedule:
    - cron: "0 6 * * 1"        # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        type: choice
        options: [run, backfill]
        default: run
      since:
        description: "Backfill start month (YYYY-MM), only for backfill mode"
        default: "2023-01"

permissions:
  contents: write   # commit refreshed data back to the repo

concurrency:
  group: "joblosstracker"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run ingestion pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTRACTION_MODEL: ${{ vars.EXTRACTION_MODEL }}
        run: |
          # Default: FREE heuristic extraction (no API key, no credits used).
          # To upgrade to Claude extraction later, add a repository VARIABLE
          # USE_CLAUDE=true and the ANTHROPIC_API_KEY secret -- no code change.
          LLM_FLAG="--no-llm"
          if [ "${{ vars.USE_CLAUDE }}" = "true" ]; then LLM_FLAG=""; fi
          echo "Extraction mode: ${LLM_FLAG:-Claude}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "backfill" ]; then
            python -m ingest.pipeline backfill --since "${{ inputs.since }}" $LLM_FLAG
          else
            python -m ingest.pipeline run $LLM_FLAG
          fi

      - name: Commit updated dataset
        run: |
          git config user.name "joblosstracker-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- docs/data/layoffs.json; then
            git add docs/data/layoffs.json
            git commit -m "data: refresh layoffs dataset ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No dataset changes to commit."
          fi
